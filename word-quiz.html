<title>중학 영단어 2000</title>
<style>
  :root {
    --bg: #eef4ff;
    --card: #ffffff;
    --text: #1f2a44;
    --muted: #6b7690;
    --primary: #4a6cf7;
    --primary-dark: #3553d4;
    --primary-soft: #eef1ff;
    --border: #d5ddf0;
    --correct: #1f9d55;
    --correct-bg: #e3f7ec;
    --wrong: #d64545;
    --wrong-bg: #fde8e8;
    --warn: #c77700;
    --warn-bg: #fff4e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    padding: 16px;
  }
  .app { max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 10px 30px rgba(40, 60, 120, 0.12);
    margin-bottom: 16px;
  }
  h1 { margin: 0 0 6px; font-size: 26px; text-align: center; }
  h2 { font-size: 17px; margin: 22px 0 10px; }
  h2:first-child { margin-top: 0; }
  .sub { margin: 0 0 4px; text-align: center; color: var(--muted); font-size: 14px; }
  .hidden { display: none !important; }

  /* 선택 칩 */
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chips.four { grid-template-columns: repeat(2, 1fr); }
  .chip {
    padding: 12px 8px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    cursor: pointer;
    text-align: center;
  }
  .chip small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .chip.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); font-weight: 700; }
  .chip.on small { color: var(--primary-dark); }

  .progress-row { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 8px; }
  .progress-row .label { width: 52px; font-weight: 700; }
  .progress-row .meter { flex: 1; height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progress-row .meter > div { height: 100%; background: var(--primary); }
  .progress-row .num { width: 82px; text-align: right; color: var(--muted); font-size: 13px; }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    margin-top: 10px;
  }
  .btn:hover:not(:disabled) { background: var(--primary-dark); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.warn { background: var(--warn); }
  .btn.ghost { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
  .btn.ghost:hover { background: var(--primary-soft); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* 문제 화면 */
  .top { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .bar > div { height: 100%; background: var(--primary); width: 0; transition: width .3s; }
  .tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary-dark);
  }
  .tag.review { background: var(--warn-bg); color: var(--warn); }
  .qhead { text-align: center; margin-bottom: 10px; }
  .word {
    text-align: center;
    font-size: 40px;
    font-weight: 800;
    margin: 6px 0 4px;
    word-break: break-word;
  }
  .speak {
    border: none;
    background: var(--primary-soft);
    color: var(--primary-dark);
    border-radius: 999px;
    width: 36px;
    height: 36px;
    font-size: 17px;
    cursor: pointer;
    vertical-align: middle;
    flex-shrink: 0;
  }
  .hint { text-align: center; color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .sentence {
    font-size: 21px;
    line-height: 1.6;
    text-align: center;
    margin: 10px 0 6px;
    word-break: break-word;
  }
  .sentence b { color: var(--primary-dark); }
  .blank {
    display: inline-block;
    min-width: 80px;
    border-bottom: 3px solid var(--primary);
    color: transparent;
  }
  .trans { text-align: center; color: var(--muted); margin: 0 0 18px; }
  .choices { display: grid; gap: 10px; }
  .choice {
    width: 100%;
    padding: 13px 16px;
    font-size: 18px;
    text-align: left;
    background: #fff;
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .choice:hover:not(:disabled) { border-color: var(--primary); background: #f5f7ff; }
  .choice:disabled { cursor: default; }
  .choice .num { display: inline-block; width: 28px; color: var(--muted); font-weight: 700; }
  .choice.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); font-weight: 700; }
  .choice.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); font-weight: 700; }
  .spell-hint { text-align: center; font-size: 22px; letter-spacing: 4px; font-family: ui-monospace, Menlo, monospace; margin-bottom: 12px; color: var(--muted); }
  .spell-row { display: flex; gap: 8px; }
  .spell-row input {
    flex: 1;
    min-width: 0;
    font-size: 20px;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-family: inherit;
  }
  .spell-row input:focus { outline: none; border-color: var(--primary); }
  .spell-row input.correct { border-color: var(--correct); background: var(--correct-bg); }
  .spell-row input.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .spell-row .btn { width: auto; margin: 0; padding: 12px 18px; }
  .feedback { min-height: 26px; margin: 16px 0 8px; text-align: center; font-size: 18px; font-weight: 700; }
  .feedback.ok { color: var(--correct); }
  .feedback.no { color: var(--wrong); }
  .explain {
    background: #f6f8fd;
    border-radius: 12px;
    padding: 14px;
    margin-top: 6px;
  }
  .explain .line1 { display: flex; align-items: center; gap: 8px; font-size: 17px; margin-bottom: 8px; }
  .explain .line1 .en { font-weight: 800; }
  .explain .ex { display: flex; align-items: flex-start; gap: 8px; }
  .explain .ex p { margin: 0; line-height: 1.5; }
  .explain .ex .kr { color: var(--muted); font-size: 14px; }
  .explain .ex b { color: var(--primary-dark); }
  .quit { background: none; border: none; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; text-decoration: underline; display: block; margin: 14px auto 0; }

  /* 결과 */
  .score { text-align: center; font-size: 56px; font-weight: 800; color: var(--primary); margin: 8px 0; }
  .msg { text-align: center; font-size: 18px; margin: 0 0 8px; }
  .perfect { text-align: center; color: var(--correct); font-weight: 700; margin: 16px 0; }

  /* 단어 목록 */
  .wlist { list-style: none; padding: 0; margin: 0; }
  .wlist li {
    padding: 12px 14px;
    border-radius: 12px;
    background: #f6f8fd;
    margin-bottom: 8px;
  }
  .wlist li.bad { background: var(--wrong-bg); }
  .wlist .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .wlist .en { font-weight: 800; font-size: 17px; }
  .wlist .ko { flex: 1; min-width: 80px; }
  .wlist .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #fff; color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
  .wlist .badge.miss { color: var(--wrong); border-color: var(--wrong); }
  .wlist .ex { font-size: 14px; margin-top: 6px; line-height: 1.5; }
  .wlist .ex b { color: var(--primary-dark); }
  .wlist .ex .kr { color: var(--muted); display: block; }
  .wlist .mine { color: var(--wrong); font-size: 13px; margin-top: 4px; }
  .filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .filters select, .filters input[type=search] {
    font: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
  }
  .filters input[type=search] { flex: 1; min-width: 140px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-bottom: 12px; color: var(--text); }
  .count-line { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .more { text-align: center; color: var(--muted); font-size: 14px; }
  .link { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; margin-top: 12px; }
  .backbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .backbar button { background: none; border: none; font: inherit; color: var(--primary); cursor: pointer; font-size: 15px; padding: 4px 0; }
  .review-note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-top: 12px; line-height: 1.5; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== 홈 ===== -->
  <section id="home" class="card">
    <h1>📝 중학 영단어</h1>
    <p class="sub" id="totalText"></p>

    <h2>학년 고르기 <small style="color:var(--muted);font-weight:400">(여러 개 선택 가능)</small></h2>
    <div class="chips" id="gradeChips"></div>

    <h2>연습 방법</h2>
    <div class="chips four" id="modeChips"></div>

    <h2>문제 수</h2>
    <div class="chips" id="countChips"></div>

    <button class="btn" id="startBtn">연습 시작</button>
    <button class="btn warn" id="reviewBtn">🔁 자주 틀린 단어 복습</button>
    <button class="btn ghost" id="listBtn">📖 단어장 보기</button>

    <h2>나의 학습 현황</h2>
    <div id="progressBox"></div>
    <p class="count-line" style="margin-top:10px">아직 안 푼 단어가 먼저 나와요. 틀린 단어는 '복습'에 모이고, 복습에서 2번 연속 맞히면 빠져요.</p>
  </section>

  <!-- ===== 문제 ===== -->
  <section id="quiz" class="card hidden">
    <div class="top">
      <span id="progressText">1 / 10</span>
      <span id="scoreText">맞힘 0</span>
    </div>
    <div class="bar"><div id="progressBar"></div></div>
    <div id="qbox"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explain hidden" id="explain"></div>
    <button class="btn hidden" id="nextBtn">다음 문제</button>
    <button class="quit" id="quitBtn">그만하고 결과 보기</button>
  </section>

  <!-- ===== 결과 ===== -->
  <section id="result" class="card hidden">
    <h1>결과</h1>
    <div class="score" id="finalScore">0 / 10</div>
    <p class="msg" id="finalMsg"></p>
    <div id="wrongBox"></div>
    <div class="btn-row">
      <button class="btn warn" id="retryWrongBtn">틀린 것 다시</button>
      <button class="btn" id="againBtn">새 문제 풀기</button>
    </div>
    <button class="btn ghost" id="homeBtn">처음으로</button>
  </section>

  <!-- ===== 단어장 ===== -->
  <section id="list" class="card hidden">
    <div class="backbar">
      <button id="listBackBtn">← 처음으로</button>
      <strong>📖 단어장</strong>
      <span style="width:72px"></span>
    </div>
    <div class="filters">
      <select id="listGrade">
        <option value="0">전체 학년</option>
        <option value="1">1학년</option>
        <option value="2">2학년</option>
        <option value="3">3학년</option>
      </select>
      <input type="search" id="listSearch" placeholder="영어나 뜻으로 찾기">
    </div>
    <label class="check"><input type="checkbox" id="listMissOnly"> 틀린 적 있는 단어만 (많이 틀린 순)</label>
    <div class="count-line" id="listCount"></div>
    <ul class="wlist" id="wordList"></ul>
    <div class="more" id="listMore"></div>
    <button class="link" id="resetBtn">학습 기록 모두 지우기</button>
  </section>

</div>

<script>
  // ---------------------------------------------------------------
  //  단어 읽기
  // ---------------------------------------------------------------
  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function parseWords(text) {
    const list = [];
    const seen = new Set();
    text.split("\n").forEach((raw) => {
      const line = raw.trim();
      if (!line || line.startsWith("#")) return;
      const p = line.split("|").map((s) => s.trim());
      if (p.length < 2 || !p[0] || !p[1]) return;
      const en = p[0];
      const id = en.toLowerCase();
      if (seen.has(id)) return;
      seen.add(id);
      const grade = [1, 2, 3].includes(Number(p[2])) ? Number(p[2]) : 1;
      let sen = p[3] || "";
      const tr = p[4] || "";
      // 대괄호가 없으면 예문에서 단어를 찾아 자동으로 표시
      if (sen && !/\[[^\]]+\]/.test(sen)) {
        const re = new RegExp("\\b" + escapeRegExp(en) + "\\b", "i");
        sen = re.test(sen) ? sen.replace(re, "[$&]") : "";
      }
      const m = sen.match(/\[([^\]]+)\]/);
      list.push({ id, en, ko: p[1], grade, sen, tr, target: m ? m[1] : en });
    });
    return list;
  }

  const WORDS = parseWords(WORD_DATA);
  const BY_ID = new Map(WORDS.map((w) => [w.id, w]));

  // ---------------------------------------------------------------
  //  학습 기록 (이 브라우저에 저장)
  //  s: 푼 횟수, c: 맞힌 횟수, w: 틀린 횟수, st: 연속으로 맞힌 횟수, t: 마지막으로 틀린 시각
  // ---------------------------------------------------------------
  const STORE_KEY = "middle-word-2000-stats";
  const SETTINGS_KEY = "middle-word-2000-settings";
  const MASTER_STREAK = 2; // 복습에서 이만큼 연속으로 맞히면 복습 목록에서 빠짐

  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  let stats = load(STORE_KEY, {});
  const settings = Object.assign({ grades: [1], mode: "meaning", count: 10 }, load(SETTINGS_KEY, {}));

  function record(word, ok) {
    const s = stats[word.id] || { s: 0, c: 0, w: 0, st: 0, t: 0 };
    s.s++;
    if (ok) { s.c++; s.st++; }
    else { s.w++; s.st = 0; s.t = Date.now(); }
    stats[word.id] = s;
    save(STORE_KEY, stats);
  }

  function needsReview(word) {
    const s = stats[word.id];
    return !!s && s.w > 0 && s.st < MASTER_STREAK;
  }

  function reviewWords() {
    return WORDS.filter(needsReview).sort((a, b) => {
      const sa = stats[a.id], sb = stats[b.id];
      return sb.w - sa.w || sb.t - sa.t;
    });
  }

  // ---------------------------------------------------------------
  //  도우미
  // ---------------------------------------------------------------
  const $ = (id) => document.getElementById(id);

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // 예문을 HTML로: 연습 단어는 굵게, 또는 빈칸으로
  function sentenceHTML(word, blank) {
    return esc(word.sen).replace(/\[([^\]]+)\]/, (_, t) =>
      blank ? `<span class="blank">${"_".repeat(Math.max(6, t.length))}</span>` : `<b>${t}</b>`
    ).replace(/[\[\]]/g, "");
  }
  function plainSentence(word) { return word.sen.replace(/[\[\]]/g, ""); }

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
  function speakBtn(text) {
    const b = document.createElement("button");
    b.className = "speak";
    b.type = "button";
    b.title = "발음 듣기";
    b.textContent = "🔊";
    b.addEventListener("click", (e) => { e.stopPropagation(); speak(text); });
    return b;
  }

  function show(id) {
    ["home", "quiz", "result", "list"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------
  //  홈 화면
  // ---------------------------------------------------------------
  const MODES = [
    { id: "meaning", name: "뜻 고르기", desc: "영어 → 한국어 뜻" },
    { id: "blank", name: "문장 빈칸", desc: "예문에 맞는 단어 고르기" },
    { id: "spell", name: "문장 쓰기", desc: "예문 속 단어 직접 쓰기" },
    { id: "mix", name: "섞어서", desc: "세 가지를 골고루" },
  ];
  const MODE_NAME = { meaning: "뜻 고르기", blank: "문장 빈칸", spell: "문장 쓰기" };
  const COUNTS = [10, 20, 30];

  function gradeWords(g) { return WORDS.filter((w) => w.grade === g); }

  function renderHome() {
    const n = [1, 2, 3].map((g) => gradeWords(g).length);
    $("totalText").textContent = `총 ${WORDS.length}단어 · 1학년 ${n[0]} · 2학년 ${n[1]} · 3학년 ${n[2]}`;

    const gc = $("gradeChips");
    gc.innerHTML = "";
    [1, 2, 3].forEach((g, i) => {
      const b = document.createElement("button");
      b.className = "chip" + (settings.grades.includes(g) ? " on" : "");
      b.innerHTML = `${g}학년<small>${n[i]}단어</small>`;
      b.addEventListener("click", () => {
        const has = settings.grades.includes(g);
        if (has && settings.grades.length === 1) return; // 최소 하나는 선택
        settings.grades = has ? settings.grades.filter((x) => x !== g) : [...settings.grades, g].sort();
        save(SETTINGS_KEY, settings);
        renderHome();
      });
      gc.appendChild(b);
    });

    const mc = $("modeChips");
    mc.innerHTML = "";
    MODES.forEach((m) => {
      const b = document.createElement("button");
      b.className = "chip" + (settings.mode === m.id ? " on" : "");
      b.innerHTML = `${m.name}<small>${m.desc}</small>`;
      b.addEventListener("click", () => { settings.mode = m.id; save(SETTINGS_KEY, settings); renderHome(); });
      mc.appendChild(b);
    });

    const cc = $("countChips");
    cc.innerHTML = "";
    COUNTS.forEach((c) => {
      const b = document.createElement("button");
      b.className = "chip" + (settings.count === c ? " on" : "");
      b.textContent = `${c}문제`;
      b.addEventListener("click", () => { settings.count = c; save(SETTINGS_KEY, settings); renderHome(); });
      cc.appendChild(b);
    });

    const rv = reviewWords().length;
    $("reviewBtn").textContent = rv ? `🔁 자주 틀린 단어 복습 (${rv}개)` : "🔁 자주 틀린 단어 복습 (아직 없음)";
    $("reviewBtn").disabled = rv === 0;

    const pb = $("progressBox");
    pb.innerHTML = "";
    [1, 2, 3].forEach((g, i) => {
      const words = gradeWords(g);
      const done = words.filter((w) => stats[w.id] && stats[w.id].c > 0).length;
      const pct = words.length ? Math.round((done / words.length) * 100) : 0;
      const row = document.createElement("div");
      row.className = "progress-row";
      row.innerHTML = `<span class="label">${g}학년</span><div class="meter"><div style="width:${pct}%"></div></div><span class="num">${done} / ${words.length}</span>`;
      pb.appendChild(row);
    });
  }

  // ---------------------------------------------------------------
  //  문제 만들기
  // ---------------------------------------------------------------
  let session = null;

  // 덜 푼 단어 → 많이 틀린 단어 순으로 우선 뽑기
  function pickNewWords(grades, count) {
    const pool = WORDS.filter((w) => grades.includes(w.grade));
    const scored = shuffle(pool).map((w) => {
      const s = stats[w.id];
      return { w, k: s ? s.c : -1 };
    });
    scored.sort((a, b) => a.k - b.k);
    return shuffle(scored.slice(0, count).map((x) => x.w));
  }

  function chooseType(word, mode) {
    const types = word.sen ? ["meaning", "blank", "spell"] : ["meaning"];
    if (mode === "mix") return types[Math.floor(Math.random() * types.length)];
    return types.includes(mode) ? mode : "meaning";
  }

  function distractors(word, count, getValue) {
    const answer = getValue(word);
    const sameGrade = shuffle(WORDS.filter((w) => w.grade === word.grade && w.id !== word.id));
    const others = shuffle(WORDS.filter((w) => w.grade !== word.grade && w.id !== word.id));
    const out = [];
    for (const w of [...sameGrade, ...others]) {
      const v = getValue(w);
      if (v && v.toLowerCase() !== answer.toLowerCase() && !out.some((o) => o.toLowerCase() === v.toLowerCase())) out.push(v);
      if (out.length === count) break;
    }
    return out;
  }

  function buildQuestion(word, mode) {
    const type = chooseType(word, mode);
    const q = { word, type };
    if (type === "meaning") {
      q.answer = word.ko;
      q.choices = shuffle([word.ko, ...distractors(word, 3, (w) => w.ko)]);
    } else if (type === "blank") {
      q.answer = word.target;
      q.choices = shuffle([word.target, ...distractors(word, 3, (w) => (w.sen ? w.target : w.en))]);
    } else {
      q.answer = word.target;
    }
    return q;
  }

  function startSession(words, kind) {
    if (!words.length) return;
    session = {
      kind, // "new" | "review" | "retry"
      questions: words.map((w) => buildQuestion(w, settings.mode)),
      current: 0,
      score: 0,
      wrongs: [],
      answered: false,
    };
    show("quiz");
    renderQuestion();
  }

  function startNew() {
    if (WORDS.length < 4) { alert("단어를 4개 이상 넣어 주세요!"); return; }
    startSession(pickNewWords(settings.grades, settings.count), "new");
  }
  function startReview() {
    const list = reviewWords();
    // 많이 틀린 단어부터, 순서는 섞어서
    startSession(shuffle(list.slice(0, settings.count)), "review");
  }

  // ---------------------------------------------------------------
  //  문제 화면
  // ---------------------------------------------------------------
  function renderQuestion() {
    const q = session.questions[session.current];
    const total = session.questions.length;
    session.answered = false;

    $("progressText").textContent = `${session.current + 1} / ${total}`;
    $("scoreText").textContent = `맞힘 ${session.score}`;
    $("progressBar").style.width = `${(session.current / total) * 100}%`;
    $("feedback").textContent = "";
    $("feedback").className = "feedback";
    $("explain").classList.add("hidden");
    $("nextBtn").classList.add("hidden");

    const box = $("qbox");
    box.innerHTML = "";

    const head = document.createElement("div");
    head.className = "qhead";
    const tags = [`<span class="tag">${q.word.grade}학년 · ${MODE_NAME[q.type]}</span>`];
    if (session.kind === "review") {
      const s = stats[q.word.id];
      tags.push(`<span class="tag review">틀린 횟수 ${s ? s.w : 0}</span>`);
    }
    head.innerHTML = tags.join(" ");
    box.appendChild(head);

    if (q.type === "meaning") {
      const w = document.createElement("div");
      w.className = "word";
      w.textContent = q.word.en + " ";
      w.appendChild(speakBtn(q.word.en));
      box.appendChild(w);
      const h = document.createElement("p");
      h.className = "hint";
      h.textContent = "알맞은 뜻을 고르세요 (키보드 1~4)";
      box.appendChild(h);
      box.appendChild(choiceButtons(q));
    } else {
      const s = document.createElement("p");
      s.className = "sentence";
      s.innerHTML = sentenceHTML(q.word, true);
      box.appendChild(s);
      const t = document.createElement("p");
      t.className = "trans";
      t.textContent = q.word.tr;
      box.appendChild(t);

      if (q.type === "blank") {
        const h = document.createElement("p");
        h.className = "hint";
        h.textContent = "빈칸에 알맞은 단어를 고르세요 (키보드 1~4)";
        box.insertBefore(h, s);
        box.appendChild(choiceButtons(q));
      } else {
        const hint = document.createElement("div");
        hint.className = "spell-hint";
        hint.textContent = q.answer.split("").map((ch, i) => (i === 0 || ch === " " || ch === "-" ? ch : "_")).join(" ").replace(/ {3}/g, "   ");
        const h = document.createElement("p");
        h.className = "hint";
        h.textContent = `뜻: ${q.word.ko} · 빈칸에 들어갈 단어를 써 보세요`;
        box.appendChild(h);
        box.appendChild(hint);
        const row = document.createElement("form");
        row.className = "spell-row";
        row.innerHTML = `<input id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 쓰기"><button class="btn" type="submit">확인</button>`;
        row.addEventListener("submit", (e) => { e.preventDefault(); checkSpelling(); });
        box.appendChild(row);
        setTimeout(() => $("spellInput").focus(), 0);
      }
    }
  }

  function choiceButtons(q) {
    const wrap = document.createElement("div");
    wrap.className = "choices";
    q.choices.forEach((c, i) => {
      const b = document.createElement("button");
      b.className = "choice";
      b.innerHTML = `<span class="num">${i + 1}</span>`;
      b.append(c);
      b.addEventListener("click", () => choose(i));
      wrap.appendChild(b);
    });
    return wrap;
  }

  function choose(index) {
    if (session.answered) return;
    const q = session.questions[session.current];
    const picked = q.choices[index];
    const ok = picked === q.answer;
    $("qbox").querySelectorAll(".choice").forEach((b, i) => {
      b.disabled = true;
      if (q.choices[i] === q.answer) b.classList.add("correct");
      else if (i === index) b.classList.add("wrong");
    });
    finishAnswer(q, ok, picked);
  }

  function normalize(s) {
    return s.toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, " ").trim();
  }

  function checkSpelling() {
    if (session.answered) return;
    const q = session.questions[session.current];
    const input = $("spellInput");
    const typed = input.value;
    if (!typed.trim()) { input.focus(); return; }
    const ok = normalize(typed) === normalize(q.answer);
    input.disabled = true;
    input.classList.add(ok ? "correct" : "wrong");
    $("qbox").querySelector(".spell-row button").disabled = true;
    // 빈칸 자리에 정답 보여 주기
    $("qbox").querySelector(".sentence").innerHTML = sentenceHTML(q.word, false);
    finishAnswer(q, ok, typed.trim());
  }

  function finishAnswer(q, ok, picked) {
    session.answered = true;
    record(q.word, ok);
    const fb = $("feedback");
    if (ok) {
      session.score++;
      fb.textContent = "⭕ 정답이에요!";
      fb.className = "feedback ok";
    } else {
      session.wrongs.push({ word: q.word, mine: picked });
      fb.textContent = `❌ 틀렸어요. 정답은 "${q.answer}"`;
      fb.className = "feedback no";
    }
    $("scoreText").textContent = `맞힘 ${session.score}`;
    $("progressBar").style.width = `${((session.current + 1) / session.questions.length) * 100}%`;
    renderExplain(q.word);

    const last = session.current === session.questions.length - 1;
    $("nextBtn").textContent = last ? "결과 보기" : "다음 문제";
    $("nextBtn").classList.remove("hidden");
    setTimeout(() => $("nextBtn").focus(), 0);
  }

  // 답한 뒤: 단어 + 뜻 + 예문(해석)으로 문장 연습
  function renderExplain(word) {
    const ex = $("explain");
    ex.innerHTML = "";
    const l1 = document.createElement("div");
    l1.className = "line1";
    l1.innerHTML = `<span class="en">${esc(word.en)}</span><span>${esc(word.ko)}</span>`;
    l1.prepend(speakBtn(word.en));
    ex.appendChild(l1);
    if (word.sen) {
      const row = document.createElement("div");
      row.className = "ex";
      const p = document.createElement("p");
      p.innerHTML = `${sentenceHTML(word, false)}<br><span class="kr">${esc(word.tr)}</span>`;
      row.append(speakBtn(plainSentence(word)), p);
      ex.appendChild(row);
    }
    ex.classList.remove("hidden");
  }

  function next() {
    session.current++;
    if (session.current < session.questions.length) renderQuestion();
    else showResult();
  }

  // ---------------------------------------------------------------
  //  결과 화면
  // ---------------------------------------------------------------
  function showResult() {
    show("result");
    const total = session.current >= session.questions.length ? session.questions.length : session.current + (session.answered ? 1 : 0);
    $("finalScore").textContent = `${session.score} / ${total}`;
    const ratio = total ? session.score / total : 0;
    $("finalMsg").textContent =
      total === 0 ? "다음에 다시 도전해요!" :
      ratio === 1 ? "🏆 다 맞혔어요! 정말 대단해요!" :
      ratio >= 0.8 ? "👏 아주 잘했어요!" :
      ratio >= 0.5 ? "🙂 좋아요, 조금만 더 연습해 봐요!" :
                     "💪 틀린 단어를 복습하고 다시 도전해요!";

    const box = $("wrongBox");
    box.innerHTML = "";
    if (total > 0 && session.wrongs.length === 0) {
      box.innerHTML = '<p class="perfect">틀린 단어가 없어요! 🎉</p>';
    } else if (session.wrongs.length) {
      const h = document.createElement("h2");
      h.textContent = `틀린 단어 (${session.wrongs.length}개)`;
      box.appendChild(h);
      box.appendChild(wordListEl(session.wrongs.map((x) => x.word), session.wrongs.map((x) => x.mine)));
      const note = document.createElement("div");
      note.className = "review-note";
      note.textContent = "틀린 단어는 '자주 틀린 단어 복습'에 저장됐어요. 복습에서 2번 연속 맞히면 목록에서 빠져요.";
      box.appendChild(note);
    }
    $("retryWrongBtn").disabled = session.wrongs.length === 0;
  }

  // ---------------------------------------------------------------
  //  단어 목록 (결과 화면 / 단어장 공용)
  // ---------------------------------------------------------------
  function wordListEl(words, mines) {
    const ul = document.createElement("ul");
    ul.className = "wlist";
    words.forEach((w, i) => {
      const s = stats[w.id];
      const li = document.createElement("li");
      if (mines || needsReview(w)) li.className = "bad";
      const row = document.createElement("div");
      row.className = "row1";
      row.appendChild(speakBtn(w.en));
      row.insertAdjacentHTML("beforeend",
        `<span class="en">${esc(w.en)}</span><span class="ko">${esc(w.ko)}</span>` +
        `<span class="badge">${w.grade}학년</span>` +
        (s && s.w ? `<span class="badge miss">${s.w}번 틀림</span>` : ""));
      li.appendChild(row);
      if (mines) {
        const m = document.createElement("div");
        m.className = "mine";
        m.textContent = `내 답: ${mines[i]}`;
        li.appendChild(m);
      }
      if (w.sen) {
        const ex = document.createElement("div");
        ex.className = "ex";
        ex.innerHTML = `${sentenceHTML(w, false)}<span class="kr">${esc(w.tr)}</span>`;
        li.appendChild(ex);
      }
      ul.appendChild(li);
    });
    return ul;
  }

  const LIST_PAGE = 100;
  let listLimit = LIST_PAGE;

  function renderList() {
    const g = Number($("listGrade").value);
    const qText = $("listSearch").value.trim().toLowerCase();
    const missOnly = $("listMissOnly").checked;
    let words = WORDS.filter((w) =>
      (!g || w.grade === g) &&
      (!qText || w.en.toLowerCase().includes(qText) || w.ko.includes(qText)) &&
      (!missOnly || (stats[w.id] && stats[w.id].w > 0))
    );
    if (missOnly) words.sort((a, b) => stats[b.id].w - stats[a.id].w);
    $("listCount").textContent = `${words.length}개 단어`;
    const ul = $("wordList");
    ul.replaceWith(Object.assign(wordListEl(words.slice(0, listLimit)), { id: "wordList" }));
    const more = $("listMore");
    more.innerHTML = "";
    if (words.length > listLimit) {
      const b = document.createElement("button");
      b.className = "btn ghost";
      b.textContent = `더 보기 (${words.length - listLimit}개 남음)`;
      b.addEventListener("click", () => { listLimit += LIST_PAGE; renderList(); });
      more.appendChild(b);
    }
  }
  function resetListAndRender() { listLimit = LIST_PAGE; renderList(); }

  // ---------------------------------------------------------------
  //  버튼 연결
  // ---------------------------------------------------------------
  $("startBtn").addEventListener("click", startNew);
  $("reviewBtn").addEventListener("click", startReview);
  $("listBtn").addEventListener("click", () => { show("list"); resetListAndRender(); });
  $("listBackBtn").addEventListener("click", () => { renderHome(); show("home"); });
  $("nextBtn").addEventListener("click", next);
  $("quitBtn").addEventListener("click", showResult);
  $("homeBtn").addEventListener("click", () => { renderHome(); show("home"); });
  $("againBtn").addEventListener("click", () => (session.kind === "review" && reviewWords().length ? startReview() : startNew()));
  $("retryWrongBtn").addEventListener("click", () => startSession(shuffle(session.wrongs.map((x) => x.word)), "retry"));
  $("listGrade").addEventListener("change", resetListAndRender);
  $("listSearch").addEventListener("input", resetListAndRender);
  $("listMissOnly").addEventListener("change", resetListAndRender);
  $("resetBtn").addEventListener("click", () => {
    if (!confirm("지금까지의 학습 기록과 틀린 단어 기록을 모두 지울까요?")) return;
    stats = {};
    save(STORE_KEY, stats);
    resetListAndRender();
  });

  document.addEventListener("keydown", (e) => {
    if ($("quiz").classList.contains("hidden") || !session) return;
    const q = session.questions[session.current];
    if (!session.answered && q.type !== "spell" && ["1", "2", "3", "4"].includes(e.key)) {
      const i = Number(e.key) - 1;
      if (i < q.choices.length) choose(i);
    }
  });

  renderHome();
</script>
</body>
</html>
