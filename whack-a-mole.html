<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두더지 잡기</title>
<style>
  :root {
    --sky-top: #bfe9ff;
    --sky-bottom: #fff4d6;
    --grass: #8fd16a;
    --grass-dark: #6bb64a;
    --hole: #5a3a22;
    --hole-rim: #7a5234;
    --mole: #b07a52;
    --mole-dark: #8c5b3a;
    --belly: #f3d2b0;
    --nose: #ff8fa3;
    --text: #4a3b5c;
    --pink: #ff7eb6;
    --yellow: #ffd166;
    --card: #ffffffee;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    color: var(--text);
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  /* 떠다니는 구름 */
  .cloud {
    position: fixed;
    background: #fff;
    border-radius: 50px;
    opacity: .8;
    z-index: 0;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }
  .cloud::before { width: 50%; height: 140%; left: 15%; top: -60%; }
  .cloud::after  { width: 40%; height: 120%; right: 12%; top: -45%; }
  .c1 { width: 110px; height: 34px; top: 8%;  animation-duration: 38s; }
  .c2 { width: 80px;  height: 26px; top: 22%; animation-duration: 52s; animation-delay: -20s; }
  .c3 { width: 130px; height: 40px; top: 14%; animation-duration: 64s; animation-delay: -40s; }
  @keyframes drift {
    from { left: -160px; }
    to   { left: 100vw; }
  }

  h1 {
    position: relative;
    z-index: 1;
    margin: 4px 0 12px;
    font-size: clamp(30px, 7vw, 46px);
    color: #fff;
    letter-spacing: 2px;
    text-shadow:
      3px 3px 0 var(--pink),
      -2px -2px 0 var(--pink),
      2px -2px 0 var(--pink),
      -2px 2px 0 var(--pink),
      0 6px 12px rgba(0,0,0,.15);
  }

  .hud {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 12px;
    width: min(460px, 100%);
    margin-bottom: 14px;
  }
  .pill {
    flex: 1;
    background: var(--card);
    border-radius: 20px;
    padding: 10px 14px;
    box-shadow: 0 5px 0 rgba(0,0,0,.08);
    text-align: center;
  }
  .pill .label { font-size: 14px; opacity: .7; white-space: nowrap; }
  #level.up { animation: levelPop .5s cubic-bezier(.3, 1.6, .6, 1); color: var(--pink); }
  @keyframes levelPop { from { transform: scale(1.8); } to { transform: scale(1); } }

  /* 단계 상승 배너 */
  .banner {
    position: absolute;
    left: 50%; top: 50%;
    z-index: 15;
    transform: translate(-50%, -50%);
    background: #fff;
    color: var(--pink);
    font-weight: 900;
    font-size: clamp(22px, 6vw, 32px);
    padding: 12px 26px;
    border-radius: 99px;
    box-shadow: 0 6px 0 #ffd6e8, 0 12px 24px rgba(0,0,0,.15);
    white-space: nowrap;
    pointer-events: none;
    animation: bannerIn 1.4s ease-out forwards;
  }
  .banner small { display: block; font-size: 15px; color: var(--text); text-align: center; }
  @keyframes bannerIn {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    25%  { transform: translate(-50%, -50%) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
  }
  .pill .value { font-size: 30px; font-weight: 800; line-height: 1.1; }
  #time.warn { color: #ff4d6d; animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.15); } }

  .timebar {
    height: 8px;
    margin-top: 6px;
    background: #f1e6ff;
    border-radius: 99px;
    overflow: hidden;
  }
  .timebar > div {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--yellow), var(--pink));
    border-radius: 99px;
    transition: width .2s linear;
  }

  /* 게임판 */
  .board {
    position: relative;
    z-index: 1;
    width: min(460px, 100%);
    --cols: 3;
    --rows: 3;
    aspect-ratio: var(--cols) / var(--rows);
    background:
      radial-gradient(circle at 20% 15%, #a6e07f 0 8%, transparent 9%),
      radial-gradient(circle at 80% 85%, #a6e07f 0 7%, transparent 8%),
      var(--grass);
    border-radius: 32px;
    border: 6px solid var(--grass-dark);
    box-shadow: 0 10px 0 var(--grass-dark), 0 18px 30px rgba(0,0,0,.15);
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: repeat(var(--rows), 1fr);
    gap: calc(12% / var(--cols));
    padding: calc(18% / var(--cols));
    transition: aspect-ratio .3s;
    cursor: pointer;
  }

  .cell {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* 구멍 안쪽 (두더지가 잘려 보이도록 하는 창) */
  .pit {
    position: absolute;
    left: 0; right: 0; bottom: 8%;
    height: 120%;
    overflow: hidden;
    border-radius: 0 0 50% 50% / 0 0 22% 22%;
    z-index: 2;
  }

  .hole {
    position: absolute;
    left: 4%; right: 4%; bottom: 0;
    height: 34%;
    background: radial-gradient(ellipse at 50% 35%, #2e1c10 0 55%, var(--hole) 70%);
    border-radius: 50%;
    border: 3px solid var(--hole-rim);
    z-index: 1;
  }
  /* 구멍 앞쪽 흙 테두리: 두더지 몸 아래를 가림 */
  .rim-front {
    position: absolute;
    left: 4%; right: 4%; bottom: 0;
    height: 17%;
    background: var(--hole-rim);
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    z-index: 3;
    pointer-events: none;
  }

  /* 두더지 */
  .mole {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 72%;
    height: 82%;
    transform: translate(-50%, 105%);
    transition: transform .16s cubic-bezier(.3, 1.6, .6, 1);
    touch-action: manipulation;
  }
  .mole.up { transform: translate(-50%, 8%); }
  .mole.hit { transition: transform .22s ease-in; transform: translate(-50%, 105%); }

  .mole .body {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 35% 25%, #c99167, var(--mole) 55%, var(--mole-dark));
    border-radius: 50% 50% 42% 42% / 60% 60% 40% 40%;
  }
  .mole .belly {
    position: absolute;
    left: 22%; right: 22%; bottom: 0;
    height: 42%;
    background: var(--belly);
    border-radius: 50% 50% 0 0;
  }
  .mole .eye {
    position: absolute;
    top: 26%;
    width: 13%;
    aspect-ratio: 1;
    background: #2b1d14;
    border-radius: 50%;
  }
  .mole .eye::after {
    content: "";
    position: absolute;
    width: 38%; height: 38%;
    top: 18%; left: 22%;
    background: #fff;
    border-radius: 50%;
  }
  .mole .eye.l { left: 26%; }
  .mole .eye.r { right: 26%; }
  .mole .cheek {
    position: absolute;
    top: 40%;
    width: 15%; height: 8%;
    background: #ff9eb5;
    border-radius: 50%;
    opacity: .75;
  }
  .mole .cheek.l { left: 13%; }
  .mole .cheek.r { right: 13%; }
  .mole .nose {
    position: absolute;
    top: 38%; left: 50%;
    width: 18%; height: 11%;
    transform: translateX(-50%);
    background: var(--nose);
    border-radius: 50%;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.12);
  }
  .mole .teeth {
    position: absolute;
    top: 49%; left: 50%;
    width: 12%; height: 8%;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 0 0 4px 4px;
    border: 1px solid #e5d6c8;
  }
  /* 맞았을 때 X 눈 */
  .mole.hit .eye { background: transparent; }
  .mole.hit .eye::after { display: none; }
  .mole.hit .eye::before {
    content: "✕";
    position: absolute;
    inset: -40%;
    display: grid;
    place-items: center;
    font-size: clamp(10px, 3vw, 16px);
    font-weight: 900;
    color: #2b1d14;
  }
  .stars {
    position: absolute;
    top: -18%; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(14px, 4vw, 22px);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .mole.hit .stars { animation: spin .4s ease-out; }
  @keyframes spin {
    0%   { opacity: 1; transform: translateX(-50%) rotate(0) scale(.6); }
    100% { opacity: 0; transform: translateX(-50%) rotate(40deg) scale(1.2); }
  }

  /* +10 점수 팝업 */
  .pop {
    position: absolute;
    z-index: 10;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 28px);
    color: var(--yellow);
    text-shadow: 2px 2px 0 var(--pink), -1px -1px 0 var(--pink);
    pointer-events: none;
    animation: rise .7s ease-out forwards;
  }
  @keyframes rise {
    from { opacity: 1; transform: translate(-50%, 0) scale(.8); }
    to   { opacity: 0; transform: translate(-50%, -60px) scale(1.25); }
  }

  /* 오버레이 (시작 / 종료) */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 244, 214, .55);
    backdrop-filter: blur(3px);
    border-radius: 26px;
    cursor: default;
  }
  .overlay.hidden { display: none; }
  .card {
    background: #fff;
    border-radius: 28px;
    padding: 26px 30px;
    text-align: center;
    box-shadow: 0 8px 0 #ffd6e8, 0 16px 30px rgba(0,0,0,.12);
    animation: bounceIn .45s cubic-bezier(.3, 1.6, .6, 1);
    max-width: 85%;
  }
  @keyframes bounceIn {
    from { transform: scale(.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .card h2 { margin: 0 0 6px; font-size: clamp(22px, 6vw, 30px); }
  .card p { margin: 4px 0; font-size: 16px; opacity: .8; }
  .card .final {
    font-size: clamp(44px, 12vw, 64px);
    font-weight: 900;
    color: var(--pink);
    margin: 6px 0 2px;
    line-height: 1;
  }
  .card .best { font-size: 15px; margin-bottom: 14px; }

  button {
    margin-top: 12px;
    font: inherit;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(var(--pink), #ff5c9d);
    border: none;
    border-radius: 99px;
    padding: 12px 34px;
    cursor: pointer;
    box-shadow: 0 6px 0 #d94683;
    transition: transform .08s, box-shadow .08s;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #d94683; }

  .tip {
    position: relative;
    z-index: 1;
    margin-top: 22px;
    font-size: 14px;
    opacity: .7;
  }

  .board.shake { animation: shake .15s; }
  @keyframes shake {
    25% { transform: translate(2px, -1px); }
    75% { transform: translate(-2px, 1px); }
  }
</style>
</head>
<body>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <h1>🔨 두더지 잡기 🐹</h1>

  <div class="hud">
    <div class="pill">
      <div class="label">🚩 단계</div>
      <div class="value" id="level">1</div>
    </div>
    <div class="pill">
      <div class="label">⏰ 남은 시간</div>
      <div class="value" id="time">30</div>
      <div class="timebar"><div id="bar"></div></div>
    </div>
    <div class="pill">
      <div class="label">⭐ 점수</div>
      <div class="value" id="score">0</div>
    </div>
  </div>

  <div class="board" id="board">
    <div class="overlay" id="startOverlay">
      <div class="card">
        <h2>두더지를 잡아라!</h2>
        <p>튀어나온 두더지를 클릭하면 <b>+10점</b></p>
        <p>제한 시간은 <b>30초</b>예요</p>
        <p><b>50점</b>마다 단계 UP! (최대 10단계)</p>
        <p>단계가 오르면 구멍이 늘고 더 빨라져요<br>대신 <b>+5초</b> 보너스!</p>
        <button id="startBtn">시작하기</button>
      </div>
    </div>

    <div class="overlay hidden" id="endOverlay">
      <div class="card">
        <h2>⏱️ 시간 끝!</h2>
        <p>최종 점수</p>
        <div class="final" id="finalScore">0</div>
        <p id="finalLevel"></p>
        <div class="best" id="bestText"></div>
        <button id="retryBtn">다시 하기</button>
      </div>
    </div>
  </div>

  <div class="tip">두더지가 숨기 전에 빨리 잡아 보세요!</div>

<script>
  const GAME_TIME = 30;
  const POINTS = 10;
  const LEVEL_STEP = 50;   // 50점마다 단계 상승
  const MAX_LEVEL = 10;
  const TIME_BONUS = 5;    // 단계가 오를 때 추가되는 시간(초)

  const board = document.getElementById('board');
  const levelEl = document.getElementById('level');
  const timeEl = document.getElementById('time');
  const barEl = document.getElementById('bar');
  const scoreEl = document.getElementById('score');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const finalLevelEl = document.getElementById('finalLevel');
  const bestText = document.getElementById('bestText');

  // 단계별 칸 수: 3×3 → 4×3 → 4×4 → … → 8×7 (가로·세로를 번갈아 하나씩 늘림)
  function gridSize(level) {
    return { cols: 3 + Math.floor(level / 2), rows: 3 + Math.floor((level - 1) / 2) };
  }

  // 단계별 속도: 등장 간격과 머무는 시간이 짧아지고, 동시에 나오는 수가 늘어남
  function speed(level) {
    const t = (level - 1) / (MAX_LEVEL - 1);
    return {
      interval: 900 - t * 580,                 // 900ms → 320ms
      stay: 1150 - t * 650,                    // 1150ms → 500ms
      maxUp: 1 + Math.floor((level - 1) / 2),  // 1마리 → 5마리
      doubleChance: Math.max(0, (level - 3) * 0.07),
    };
  }

  let moles = [];
  let score = 0;
  let level = 1;
  let timeLeft = GAME_TIME;
  let playing = false;
  let endAt = 0;
  let tickTimer = null;
  let spawnTimer = null;

  function buildBoard(lv) {
    moles.forEach(m => clearTimeout(m.hideTimer));
    board.querySelectorAll('.cell').forEach(c => c.remove());
    moles = [];

    const { cols, rows } = gridSize(lv);
    board.style.setProperty('--cols', cols);
    board.style.setProperty('--rows', rows);

    for (let i = 0; i < cols * rows; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = `
        <div class="hole"></div>
        <div class="pit">
          <div class="mole">
            <div class="stars">⭐💫⭐</div>
            <div class="body"></div>
            <div class="belly"></div>
            <div class="eye l"></div><div class="eye r"></div>
            <div class="cheek l"></div><div class="cheek r"></div>
            <div class="nose"></div>
            <div class="teeth"></div>
          </div>
        </div>
        <div class="rim-front"></div>`;
      board.appendChild(cell);

      const mole = cell.querySelector('.mole');
      const state = { el: mole, cell, up: false, hideTimer: null };
      mole.addEventListener('pointerdown', (e) => whack(state, e));
      moles.push(state);
    }
  }

  function startGame() {
    score = 0;
    level = 1;
    timeLeft = GAME_TIME;
    playing = true;
    scoreEl.textContent = 0;
    levelEl.textContent = 1;
    timeEl.textContent = GAME_TIME;
    timeEl.classList.remove('warn');
    barEl.style.width = '100%';
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    buildBoard(level);

    endAt = performance.now() + GAME_TIME * 1000;
    tickTimer = setInterval(tick, 100);
    scheduleSpawn(400);
  }

  function tick() {
    const remaining = Math.max(0, (endAt - performance.now()) / 1000);
    const shown = Math.ceil(remaining);
    if (shown !== timeLeft) {
      timeLeft = shown;
      timeEl.textContent = timeLeft;
      timeEl.classList.toggle('warn', timeLeft <= 5 && timeLeft > 0);
    }
    barEl.style.width = Math.min(1, remaining / GAME_TIME) * 100 + '%';
    if (remaining <= 0) endGame();
  }

  function scheduleSpawn(delay) {
    spawnTimer = setTimeout(() => {
      if (!playing) return;
      const sp = speed(level);
      spawn();
      if (Math.random() < sp.doubleChance) spawn();
      scheduleSpawn(rand(sp.interval * 0.8, sp.interval * 1.2));
    }, delay);
  }

  function spawn() {
    const sp = speed(level);
    if (moles.filter(m => m.up).length >= sp.maxUp) return;
    const free = moles.filter(m => !m.up);
    if (!free.length) return;
    const m = free[Math.floor(Math.random() * free.length)];
    m.up = true;
    m.el.classList.remove('hit');
    m.el.classList.add('up');
    m.hideTimer = setTimeout(() => hide(m), rand(sp.stay * 0.8, sp.stay * 1.2));
  }

  function hide(m) {
    clearTimeout(m.hideTimer);
    m.up = false;
    m.el.classList.remove('up');
  }

  function whack(m, e) {
    if (!playing || !m.up) return;
    e.preventDefault();
    clearTimeout(m.hideTimer);
    m.up = false;
    m.el.classList.remove('up');
    m.el.classList.add('hit');

    score += POINTS;
    scoreEl.textContent = score;
    showPop(m.cell);

    board.classList.remove('shake');
    void board.offsetWidth;
    board.classList.add('shake');

    const next = Math.min(MAX_LEVEL, Math.floor(score / LEVEL_STEP) + 1);
    if (next > level) levelUp(next);
  }

  function levelUp(next) {
    level = next;
    levelEl.textContent = level;
    levelEl.classList.remove('up');
    void levelEl.offsetWidth;
    levelEl.classList.add('up');

    endAt += TIME_BONUS * 1000;
    tick();

    // 잡힌 두더지 애니메이션이 끝난 뒤 판을 넓힘
    setTimeout(() => { if (playing) buildBoard(level); }, 250);

    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.innerHTML = (level === MAX_LEVEL ? '👑 마지막 단계! 👑' : `🎉 ${level}단계! 🎉`)
      + `<small>⏰ +${TIME_BONUS}초 보너스</small>`;
    board.appendChild(banner);
    banner.addEventListener('animationend', () => banner.remove());
  }

  function showPop(cell) {
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.textContent = '+' + POINTS;
    pop.style.left = (cell.offsetLeft + cell.offsetWidth / 2) + 'px';
    pop.style.top = (cell.offsetTop) + 'px';
    board.appendChild(pop);
    pop.addEventListener('animationend', () => pop.remove());
  }

  function endGame() {
    playing = false;
    clearInterval(tickTimer);
    clearTimeout(spawnTimer);
    moles.forEach(hide);
    timeEl.textContent = 0;
    timeEl.classList.remove('warn');
    barEl.style.width = '0%';

    let best = 0;
    try { best = Number(localStorage.getItem('whackBest')) || 0; } catch (_) {}
    if (score > best) {
      best = score;
      try { localStorage.setItem('whackBest', best); } catch (_) {}
      bestText.textContent = score > 0 ? '🎉 새로운 최고 기록! 🎉' : '';
    } else {
      bestText.textContent = `🏆 최고 기록: ${best}점`;
    }

    finalScoreEl.textContent = score;
    finalLevelEl.textContent = level === MAX_LEVEL
      ? '👑 최종 10단계 도달!'
      : `🚩 ${level}단계까지 도달`;
    endOverlay.classList.remove('hidden');
  }

  function rand(min, max) { return min + Math.random() * (max - min); }

  buildBoard(1);
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
</script>
</body>
</html>
